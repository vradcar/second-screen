[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondscreen"
version = "0.1.0"
description = "Explainable live match intelligence from synthetic football events"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agents = [
    "agent-framework-core==1.22.0",
    "agent-framework-foundry==1.15.0",
    "agent-framework-openai==1.17.0",
    "azure-identity>=1.26",
    "pydantic>=2.10",
]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
azure = ["azure-eventhub>=5.12", "azure-cosmos>=4.9", "azure-identity>=1.26", "aiohttp>=3.9",
         "azure-monitor-opentelemetry-exporter>=1.0.0b40"]
eval = ["azure-ai-evaluation>=1.18"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"secondscreen.server" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
